services:
  echecs:
    image: ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/chess.db
      SESSION_SECRET: ${SESSION_SECRET:?Définissez SESSION_SECRET dans deploy/.env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - donnees-echecs:/app/data

volumes:
  donnees-echecs:
